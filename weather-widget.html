<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Weather Widget</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #111111;
      --panel: #151515;
      --menu: #1d1d1d;
      --text: #ffffff;
      --muted: rgba(255,255,255,.58);
      --track: rgba(255,255,255,.12);
      --bar: #ffffff;
      --border: rgba(255,255,255,.14);
      --focus: rgba(255,255,255,.38);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Helvetica, Arial, sans-serif;
      color: var(--text);
      overflow: hidden;
    }

    body {
      display: grid;
      place-items: center;
      padding: 14px;
    }

    .widget {
      position: relative;
      width: 100%;
      height: 100%;
      max-width: 620px;
      display: flex;
      flex-direction: column;
      background: linear-gradient(180deg, rgba(255,255,255,.045), rgba(255,255,255,.02)), var(--panel);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 20px 24px;
      box-shadow: 0 1px 2px rgba(0,0,0,.18), 0 14px 38px rgba(0,0,0,.18);
    }

    header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 14px;
      flex: none;
    }

    h1 {
      margin: 0;
      font-size: clamp(20px, 4vw, 26px);
      line-height: 1.05;
      letter-spacing: -.045em;
      font-weight: 650;
    }

    .subtitle {
      margin-top: 5px;
      color: var(--muted);
      font-size: 12px;
      letter-spacing: .04em;
      text-transform: uppercase;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 220px;
    }

    .gear {
      flex: none;
      width: 32px;
      height: 32px;
      display: grid;
      place-items: center;
      padding: 0;
      border: 1px solid transparent;
      border-radius: 8px;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      transition: background 140ms ease, color 140ms ease, border-color 140ms ease;
    }

    .gear:hover,
    .gear[aria-expanded="true"] {
      background: rgba(255,255,255,.07);
      border-color: var(--border);
      color: var(--text);
    }

    .gear:focus-visible {
      outline: none;
      box-shadow: 0 0 0 3px var(--focus);
    }

    .gear svg { width: 17px; height: 17px; display: block; }

    .menu {
      position: absolute;
      top: 58px;
      right: 20px;
      z-index: 20;
      width: min(258px, calc(100% - 40px));
      background: var(--menu);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      box-shadow: 0 1px 2px rgba(0,0,0,.3), 0 12px 32px rgba(0,0,0,.45);
    }

    .menu[hidden] { display: none; }

    .menu-title {
      color: var(--muted);
      font-size: 11px;
      letter-spacing: .06em;
      text-transform: uppercase;
      margin-bottom: 12px;
    }

    .field {
      display: grid;
      gap: 6px;
      margin-bottom: 10px;
      color: var(--muted);
      font-size: 12px;
    }

    input[type="search"], input[type="text"] {
      width: 100%;
      min-height: 36px;
      border: 1px solid var(--border);
      border-radius: 9px;
      background: rgba(255,255,255,.05);
      color: var(--text);
      padding: 7px 10px;
      font: inherit;
      font-size: 13px;
      color-scheme: dark;
    }

    input:focus {
      outline: none;
      border-color: rgba(255,255,255,.35);
      box-shadow: 0 0 0 3px var(--focus);
    }

    .results {
      display: grid;
      gap: 2px;
      max-height: 152px;
      overflow-y: auto;
      margin-bottom: 10px;
    }

    .results:empty { display: none; }

    .result {
      display: block;
      width: 100%;
      text-align: left;
      padding: 7px 9px;
      border: 1px solid transparent;
      border-radius: 8px;
      background: transparent;
      color: rgba(255,255,255,.82);
      font: inherit;
      font-size: 12.5px;
      cursor: pointer;
    }

    .result:hover { background: rgba(255,255,255,.08); }

    .result:focus-visible { outline: none; box-shadow: 0 0 0 3px var(--focus); }

    .result small { display: block; color: rgba(255,255,255,.4); font-size: 11px; margin-top: 2px; }

    .toggle {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 7px 0;
      color: rgba(255,255,255,.86);
      font-size: 13px;
      cursor: pointer;
    }

    .toggle input {
      flex: none;
      width: 16px;
      height: 16px;
      margin: 0;
      accent-color: #ffffff;
      cursor: pointer;
    }

    .note {
      color: rgba(255,255,255,.4);
      font-size: 11px;
      line-height: 1.4;
      margin-top: 10px;
    }

    .readout {
      flex: none;
      display: flex;
      align-items: center;
      gap: 12px;
      line-height: 1;
    }

    .icon {
      flex: none;
      width: 38px;
      height: 38px;
      color: rgba(255,255,255,.9);
    }

    .icon svg { width: 100%; height: 100%; display: block; }

    .temps {
      display: flex;
      align-items: baseline;
      flex-wrap: wrap;
      gap: 8px;
      min-width: 0;
    }

    .temp {
      font-size: clamp(34px, 13vw, 48px);
      font-weight: 650;
      letter-spacing: -.05em;
      font-variant-numeric: tabular-nums;
    }

    .cond {
      font-size: 12px;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: rgba(255,255,255,.72);
    }

    .stack {
      flex: 1 1 auto;
      display: grid;
      grid-auto-rows: min-content;
      align-content: space-between;
      gap: 10px;
      min-height: 0;
      margin-top: 14px;
      padding-top: 14px;
      border-top: 1px solid var(--border);
    }

    .row {
      display: grid;
      grid-template-columns: 82px 1fr;
      gap: 14px;
      align-items: center;
    }

    .label {
      font-size: 14px;
      color: rgba(255,255,255,.86);
      letter-spacing: .015em;
    }

    .value {
      text-align: right;
      color: rgba(255,255,255,.72);
      font-size: 13px;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .value b { font-weight: 600; color: rgba(255,255,255,.92); }

    .value span { color: rgba(255,255,255,.4); margin-left: 5px; }

    .meta {
      flex: none;
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      color: rgba(255,255,255,.38);
      font-size: 11px;
    }

    .meta.error { color: rgba(255,255,255,.66); }

    .refresh {
      flex: none;
      width: 24px;
      height: 24px;
      display: grid;
      place-items: center;
      padding: 0;
      border: 1px solid transparent;
      border-radius: 7px;
      background: transparent;
      color: rgba(255,255,255,.45);
      cursor: pointer;
    }

    .refresh:hover { background: rgba(255,255,255,.07); color: var(--text); }

    .refresh:focus-visible { outline: none; box-shadow: 0 0 0 3px var(--focus); }

    .refresh svg { width: 13px; height: 13px; display: block; }

    .loading { opacity: .45; }

    @media (max-width: 520px) {
      body { padding: 10px; }
      .widget { padding: 18px 20px; border-radius: 16px; }
      .row { grid-template-columns: 70px 1fr; gap: 10px; }
      .menu { right: 16px; top: 54px; }
      .icon { width: 32px; height: 32px; }
    }
  </style>
</head>
<body>
  <main class="widget" aria-label="Current weather widget">
    <header>
      <div>
        <h1>Weather</h1>
        <div class="subtitle" id="placeOut">Loading&hellip;</div>
      </div>
      <button class="gear" id="gear" type="button" aria-haspopup="dialog" aria-expanded="false" aria-controls="menu" aria-label="Settings" title="Settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="3"></circle>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1.08-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 8.6a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
        </svg>
      </button>
    </header>

    <div class="menu" id="menu" role="dialog" aria-label="Weather settings" hidden>
      <div class="menu-title">Weather settings</div>
      <label class="field">
        Location
        <input id="cityInput" type="search" placeholder="Search a city" autocomplete="off" aria-label="Search a city" />
      </label>
      <div class="results" id="results" role="listbox" aria-label="City results"></div>
      <label class="toggle">
        Fahrenheit
        <input id="fahrenheit" type="checkbox" />
      </label>
      <label class="toggle">
        12-hour times
        <input id="hour12" type="checkbox" checked />
      </label>
      <div class="note" id="note">Data from Open-Meteo. Location is shared with the Forecast widget.</div>
    </div>

    <section class="readout" aria-live="polite">
      <div class="icon" id="iconOut" aria-hidden="true"></div>
      <div class="temps">
        <span class="temp" id="tempOut">&mdash;</span>
        <span class="cond" id="condOut"></span>
      </div>
    </section>

    <section class="stack" aria-label="Current conditions">
      <div class="row">
        <div class="label">Feels like</div>
        <div class="value" id="feelsOut">&mdash;</div>
      </div>
      <div class="row">
        <div class="label">High / Low</div>
        <div class="value" id="rangeOut">&mdash;</div>
      </div>
      <div class="row">
        <div class="label">Wind</div>
        <div class="value" id="windOut">&mdash;</div>
      </div>
      <div class="row">
        <div class="label">Humidity</div>
        <div class="value" id="humidityOut">&mdash;</div>
      </div>
      <div class="row">
        <div class="label">Precip</div>
        <div class="value" id="precipOut">&mdash;</div>
      </div>
      <div class="row">
        <div class="label">Sun</div>
        <div class="value" id="sunOut">&mdash;</div>
      </div>
    </section>

    <footer class="meta">
      <span id="statusOut">Loading&hellip;</span>
      <button class="refresh" id="refreshBtn" type="button" aria-label="Refresh" title="Refresh">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <polyline points="23 4 23 10 17 10"></polyline>
          <polyline points="1 20 1 14 7 14"></polyline>
          <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
        </svg>
      </button>
    </footer>
  </main>

  <script>
    (function () {
      'use strict';

      /* ---- Defaults ------------------------------------------------------
         Used until a city is chosen in the settings menu.
      --------------------------------------------------------------------- */
      var DEFAULT_PLACE = {
        name: 'Winnipeg',
        admin: 'Manitoba',
        country: 'Canada',
        latitude: 49.8844,
        longitude: -97.1470
      };
      var REFRESH_MS = 15 * 60 * 1000;   // 15 minutes
      /* -------------------------------------------------------------------- */

      var gear = document.getElementById('gear');
      var menu = document.getElementById('menu');
      var cityInput = document.getElementById('cityInput');
      var results = document.getElementById('results');
      var fahrenheitInput = document.getElementById('fahrenheit');
      var hour12Input = document.getElementById('hour12');
      var noteEl = document.getElementById('note');

      var placeOut = document.getElementById('placeOut');
      var iconOut = document.getElementById('iconOut');
      var tempOut = document.getElementById('tempOut');
      var condOut = document.getElementById('condOut');
      var feelsOut = document.getElementById('feelsOut');
      var rangeOut = document.getElementById('rangeOut');
      var windOut = document.getElementById('windOut');
      var humidityOut = document.getElementById('humidityOut');
      var precipOut = document.getElementById('precipOut');
      var sunOut = document.getElementById('sunOut');
      var statusOut = document.getElementById('statusOut');
      var refreshBtn = document.getElementById('refreshBtn');
      var stack = document.querySelector('.stack');

      // Storage can be blocked inside a sandboxed embed. Never let it throw.
      var storageOk = true;
      function readStore(key) {
        try { return window.localStorage.getItem(key); }
        catch (err) { storageOk = false; return null; }
      }
      function writeStore(key, value) {
        try { window.localStorage.setItem(key, value); }
        catch (err) { storageOk = false; }
      }

      /* ---- Settings menu -------------------------------------------------- */
      function openMenu() {
        menu.hidden = false;
        gear.setAttribute('aria-expanded', 'true');
        cityInput.focus();
      }
      function closeMenu() {
        menu.hidden = true;
        gear.setAttribute('aria-expanded', 'false');
      }
      function toggleMenu() {
        if (menu.hidden) { openMenu(); } else { closeMenu(); }
      }

      gear.addEventListener('click', function (event) {
        event.stopPropagation();
        toggleMenu();
      });
      menu.addEventListener('click', function (event) { event.stopPropagation(); });
      document.addEventListener('click', function () { closeMenu(); });
      document.addEventListener('keydown', function (event) {
        if (event.key === 'Escape' && !menu.hidden) {
          closeMenu();
          gear.focus();
        }
      });

      /* ---- WMO weather codes ---------------------------------------------- */
      var CODES = {
        0: ['Clear', 'sun'], 1: ['Mainly clear', 'sun'], 2: ['Partly cloudy', 'partly'],
        3: ['Overcast', 'cloud'], 45: ['Fog', 'fog'], 48: ['Rime fog', 'fog'],
        51: ['Light drizzle', 'drizzle'], 53: ['Drizzle', 'drizzle'], 55: ['Heavy drizzle', 'drizzle'],
        56: ['Freezing drizzle', 'drizzle'], 57: ['Freezing drizzle', 'drizzle'],
        61: ['Light rain', 'rain'], 63: ['Rain', 'rain'], 65: ['Heavy rain', 'rain'],
        66: ['Freezing rain', 'rain'], 67: ['Freezing rain', 'rain'],
        71: ['Light snow', 'snow'], 73: ['Snow', 'snow'], 75: ['Heavy snow', 'snow'],
        77: ['Snow grains', 'snow'], 80: ['Light showers', 'rain'], 81: ['Showers', 'rain'],
        82: ['Heavy showers', 'rain'], 85: ['Snow showers', 'snow'], 86: ['Snow showers', 'snow'],
        95: ['Thunderstorm', 'storm'], 96: ['Thunderstorm', 'storm'], 99: ['Thunderstorm', 'storm']
      };

      function svg(inner) {
        return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" ' +
          'stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + inner + '</svg>';
      }

      var CLOUD = '<path d="M17.5 19H7a4.5 4.5 0 0 1-.36-8.98 6 6 0 0 1 11.63 1.2A3.9 3.9 0 0 1 17.5 19z"></path>';

      var ICONS = {
        sun: function (day) {
          return day
            ? svg('<circle cx="12" cy="12" r="4.2"></circle><path d="M12 2v2M12 20v2M4.2 4.2l1.5 1.5M18.3 18.3l1.5 1.5M2 12h2M20 12h2M4.2 19.8l1.5-1.5M18.3 5.7l1.5-1.5"></path>')
            : svg('<path d="M20 14.5A8 8 0 0 1 9.5 4 8.2 8.2 0 1 0 20 14.5z"></path>');
        },
        partly: function (day) {
          return svg((day
            ? '<circle cx="8.5" cy="8" r="3.1"></circle><path d="M8.5 2.4v1.6M3.6 8h-1.6M4.9 4.4 3.8 3.3M12.1 4.4l1.1-1.1"></path>'
            : '<path d="M12.6 8.4A4.6 4.6 0 0 1 8 3.8a4.7 4.7 0 1 0 4.6 4.6z"></path>') +
            '<path d="M18 20H8.5a3.9 3.9 0 0 1-.3-7.78 5.2 5.2 0 0 1 10.05 1.04A3.4 3.4 0 0 1 18 20z"></path>');
        },
        cloud: function () { return svg(CLOUD); },
        fog: function () {
          return svg('<path d="M17.5 15.5H7a4.5 4.5 0 0 1-.36-8.98 6 6 0 0 1 11.63 1.2 3.9 3.9 0 0 1-.77 7.78z"></path><path d="M4 19h10M17 19h3"></path>');
        },
        drizzle: function () { return svg(CLOUD + '<path d="M9 21v1M13 21v1M17 21v1"></path>'); },
        rain: function () { return svg(CLOUD + '<path d="M8.5 20.5 7.5 23M12.5 20.5 11.5 23M16.5 20.5 15.5 23"></path>'); },
        snow: function () { return svg(CLOUD + '<path d="M9 21.5h.01M13 21.5h.01M17 21.5h.01M9 23.5h.01M13 23.5h.01"></path>'); },
        storm: function () { return svg(CLOUD + '<path d="M13 20.5 10 21l2 3"></path>'); }
      };

      function describe(code) { return CODES[code] || ['Unknown', 'cloud']; }

      function iconFor(code, isDay) {
        var kind = describe(code)[1];
        var make = ICONS[kind] || ICONS.cloud;
        return make(isDay !== 0);
      }

      /* ---- Settings values ------------------------------------------------ */
      // Keys are shared with the Forecast widget so both follow one city.
      var place = DEFAULT_PLACE;
      try {
        var savedPlace = JSON.parse(readStore('console.place') || 'null');
        if (savedPlace && typeof savedPlace.latitude === 'number') place = savedPlace;
      } catch (err) {}

      fahrenheitInput.checked = readStore('console.fahrenheit') === '1';
      hour12Input.checked = readStore('console.hour12') !== '0';

      if (!storageOk) {
        noteEl.textContent = 'Data from Open-Meteo. This embed blocks storage, so the city resets on reload.';
      }

      function placeLabel(p) {
        return p.admin ? p.name + ', ' + p.admin : (p.country ? p.name + ', ' + p.country : p.name);
      }

      /* ---- City search ----------------------------------------------------- */
      var searchTimer = null;

      function renderResults(list) {
        if (!list || !list.length) {
          results.innerHTML = '';
          return;
        }
        results.innerHTML = list.map(function (item, index) {
          var detail = [item.admin1, item.country].filter(Boolean).join(', ');
          return '<button class="result" type="button" data-index="' + index + '">' +
            item.name + '<small>' + detail + '</small></button>';
        }).join('');

        var buttons = results.querySelectorAll('.result');
        for (var i = 0; i < buttons.length; i++) {
          buttons[i].addEventListener('click', function (event) {
            var item = list[Number(event.currentTarget.getAttribute('data-index'))];
            place = {
              name: item.name,
              admin: item.admin1 || '',
              country: item.country || '',
              latitude: item.latitude,
              longitude: item.longitude
            };
            writeStore('console.place', JSON.stringify(place));
            results.innerHTML = '';
            cityInput.value = '';
            closeMenu();
            load();
          });
        }
      }

      function searchCity(query) {
        if (!query || query.length < 2) {
          results.innerHTML = '';
          return;
        }
        var url = 'https://geocoding-api.open-meteo.com/v1/search?name=' +
          encodeURIComponent(query) + '&count=5&language=en&format=json';
        fetch(url)
          .then(function (response) { return response.json(); })
          .then(function (data) { renderResults(data.results); })
          .catch(function () {
            results.innerHTML = '<div class="note">City search unavailable.</div>';
          });
      }

      cityInput.addEventListener('input', function () {
        clearTimeout(searchTimer);
        var query = cityInput.value.trim();
        searchTimer = setTimeout(function () { searchCity(query); }, 350);
      });

      /* ---- Formatting ------------------------------------------------------ */
      function roundTemp(value) {
        return (value === null || value === undefined || isNaN(value)) ? '\u2014' : Math.round(value) + '\u00b0';
      }

      function timeFrom(iso) {
        if (!iso) return '\u2014';
        var d = new Date(iso);
        if (isNaN(d.getTime())) return '\u2014';
        return new Intl.DateTimeFormat('en-US', {
          hour: 'numeric', minute: '2-digit', hour12: hour12Input.checked
        }).format(d);
      }

      /* ---- Fetch and render ------------------------------------------------ */
      var loading = false;

      function apiUrl() {
        var unitTemp = fahrenheitInput.checked ? 'fahrenheit' : 'celsius';
        var unitWind = fahrenheitInput.checked ? 'mph' : 'kmh';
        return 'https://api.open-meteo.com/v1/forecast' +
          '?latitude=' + encodeURIComponent(place.latitude) +
          '&longitude=' + encodeURIComponent(place.longitude) +
          '&current=temperature_2m,apparent_temperature,relative_humidity_2m,precipitation,weather_code,wind_speed_10m,wind_direction_10m,is_day' +
          '&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max,sunrise,sunset' +
          '&timezone=auto&forecast_days=1' +
          '&temperature_unit=' + unitTemp + '&wind_speed_unit=' + unitWind;
      }

      function compass(degrees) {
        var points = ['N', 'NE', 'E', 'SE', 'S', 'SW', 'W', 'NW'];
        return points[Math.round(((degrees || 0) % 360) / 45) % 8];
      }

      function render(data) {
        var current = data.current || {};
        var daily = data.daily || {};
        var windUnit = fahrenheitInput.checked ? ' mph' : ' km/h';
        var precipUnit = fahrenheitInput.checked ? ' in' : ' mm';
        var info = describe(current.weather_code);

        placeOut.textContent = placeLabel(place);
        placeOut.title = placeLabel(place);
        iconOut.innerHTML = iconFor(current.weather_code, current.is_day);
        tempOut.textContent = roundTemp(current.temperature_2m);
        condOut.textContent = info[0];

        feelsOut.innerHTML = '<b>' + roundTemp(current.apparent_temperature) + '</b>';
        rangeOut.innerHTML = '<b>' + roundTemp(daily.temperature_2m_max && daily.temperature_2m_max[0]) +
          '</b><span>' + roundTemp(daily.temperature_2m_min && daily.temperature_2m_min[0]) + '</span>';
        windOut.innerHTML = '<b>' + Math.round(current.wind_speed_10m || 0) + windUnit +
          '</b><span>' + compass(current.wind_direction_10m) + '</span>';
        humidityOut.innerHTML = '<b>' + Math.round(current.relative_humidity_2m || 0) + '%</b>';

        var pop = daily.precipitation_probability_max ? daily.precipitation_probability_max[0] : null;
        precipOut.innerHTML = '<b>' + (pop === null || pop === undefined ? '\u2014' : pop + '%') +
          '</b><span>' + (current.precipitation || 0) + precipUnit + '</span>';

        sunOut.innerHTML = '<b>' + timeFrom(daily.sunrise && daily.sunrise[0]) +
          '</b><span>' + timeFrom(daily.sunset && daily.sunset[0]) + '</span>';

        statusOut.textContent = 'Updated ' + timeFrom(new Date().toISOString()) + ' \u00b7 Open-Meteo';
        statusOut.parentNode.classList.remove('error');
      }

      function load() {
        if (loading) return;
        loading = true;
        stack.classList.add('loading');
        statusOut.textContent = 'Loading\u2026';

        fetch(apiUrl())
          .then(function (response) {
            if (!response.ok) throw new Error('HTTP ' + response.status);
            return response.json();
          })
          .then(function (data) {
            writeStore('weather.cache', JSON.stringify({ place: place, data: data, ts: Date.now() }));
            render(data);
          })
          .catch(function () {
            statusOut.textContent = 'Offline \u00b7 showing last known data';
            statusOut.parentNode.classList.add('error');
          })
          .then(function () {
            loading = false;
            stack.classList.remove('loading');
          });
      }

      // Paint instantly from cache, then refresh from the network.
      try {
        var cached = JSON.parse(readStore('weather.cache') || 'null');
        if (cached && cached.data) {
          render(cached.data);
          statusOut.textContent = 'Cached \u00b7 refreshing\u2026';
        }
      } catch (err) {}

      fahrenheitInput.addEventListener('change', function () {
        writeStore('console.fahrenheit', fahrenheitInput.checked ? '1' : '0');
        load();
      });
      hour12Input.addEventListener('change', function () {
        writeStore('console.hour12', hour12Input.checked ? '1' : '0');
        load();
      });
      refreshBtn.addEventListener('click', function () { load(); });

      load();
      setInterval(load, REFRESH_MS);
      document.addEventListener('visibilitychange', function () {
        if (!document.hidden) load();
      });
    })();
  </script>
</body>
</html>
